<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MJs phone</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>
<body>
<audio id="MJ-hee-hee" src="assets/sound/hee-hee.mp3"></audio>
<audio id="MJ-shamona" src="assets/sound/shamona.mp3"></audio>
<audio id="MJ-beat-it" src="assets/sound/beat-it.mp3"></audio>
<audio id="MJ-why-not" src="assets/sound/why-not.mp3"></audio>
<audio id="MJ-rejected" src="assets/sound/rejected.mp3"></audio>
<video class="bg-video" autoplay loop muted playsinline>
    <source src="assets/video/bg.mp4" type="video/mp4">
  </video>
    <main>
        <img
        id="reflection"
        src="assets/img/reflection.gif"
        alt=""
        aria-hidden="true"> 
        <div class="camera-hole"></div>
        <div class="glass-layer"></div>
            <div class="status-bar">
                <div class="status-left">
                    <span class="time">3:47 am</span>
                </div>
    
                <div class="status-right">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-three-quarters"></i>
                    <p>78%</p>
                </div>
            </div>
            <section class="contact-section" id="contact-section">
                <h2>Contacts</h2>
                <div id = "error-message"></div> 
                <ul id="contact-list" aria-live="polite">

                </ul>
            </section>

            <section class="create-contact" id="create-contact-section">
                <h1>Add contact</h1>

                <form id="create-contact-form" autocomplete="off">
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Name"
                        class="input-field"
                    >
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Phone number"
                        class="input-field"
                    >
                    <div id="button-wrapper">
                        <button type="submit" class="create-contact-btn">
                            <i class="fas fa-plus"></i>
                            <span>create</span>
                        </button>

                        <div id="delete-all-slot">
                            <button
                                type="button"
                                id="delete-all-contacts-btn"
                                class="delete-all-contacts-btn"
                            >
                                <i class="fa-solid fa-trash"></i>
                                <span>delete all</span>
                            </button>

                            <div id="delete-confirm-group" hidden>
                                <button
                                    type="button"
                                    id="confirm-delete-all"
                                    class="icon-btn"
                                >
                                    <i class="fa-solid fa-check"></i>
                                </button>

                                <button
                                    type="button"
                                    id="cancel-delete-all"
                                    class="icon-btn"
                                >
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
