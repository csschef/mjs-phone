<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MJs phone contacts</title>
    <link rel="stylesheet" href="css/style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    >
</head>
<body>
<audio id="MJ-hee-hee" src="Assets/sound/hee-hee.mp3" type="audio/mp3"></audio>
<audio id="MJ-shamona" src="Assets/sound/shamona.mp3" type="audio/mp3"></audio>
<audio id="MJ-yow" src="Assets/sound/yow.mp3"></audio>
<audio id="MJ-beat-it" src="Assets/sound/beat-it.mp3"></audio>
<audio id="MJ-why-not" src="Assets/sound/why-not.mp3"></audio>
<audio id="MJ-rejected" src="Assets/sound/rejected.mp3"></audio>

    <main>
        <img
    id="reflection"
    src="Assets/img/reflection2.png"
    alt=""
    aria-hidden="true"> 
        <div class="camera-hole"></div>
        <div class="glass-layer">
            <section class="contact-section" id="contact-section">
                <h2>Contacts</h2>
                <ul id="contact-list" aria-live="polite">

                </ul>
                <!-- Kommer behöva lägga till denna som variabel i JS för att skapa innerHtml -->
                <div id = "error-message"></div> 
            </section>

            <section class="create-contact" id="create-contact-section">
                <h1>Add contact</h1>

        <form id="create-contact-form" autocomplete="off">
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Name"
                class="input-field"
            >

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Phone number"
                class="input-field"
            >

            <div id="button-wrapper">
                <button type="submit" class="create-contact-btn">
                    <i class="fas fa-plus"></i>
                    <span>create</span>
                </button>

                <div id="delete-all-slot">
                    <button
                        type="button"
                        id="delete-all-contacts-btn"
                        class="delete-all-contacts-btn"
                    >
                        <i class="fa-solid fa-trash"></i>
                        <span>delete all</span>
                    </button>

                    <div id="delete-confirm-group" hidden>
                        <button
                            type="button"
                            id="confirm-delete-all"
                            class="icon-btn"
                        >
                            <i class="fa-solid fa-check"></i>
                        </button>

                        <button
                            type="button"
                            id="cancel-delete-all"
                            class="icon-btn"
                        >
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
            </div>
        </form>

            </section>
    </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
